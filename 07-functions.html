<!DOCTYPE html>
<html lang='en'>
  <head>
      <title>Functions</title>
  </head>
  <body>
    <script>
      function function1() {
        console.log('hello');
        console.log(2+2);
      }

      function1();
      
      function calculateTax1() {
        
        console.log(1000 * 0.1);

      }

      calculateTax1();

      function calculateTax(cost) {
        console.log(cost * 0.1);
      }

      calculateTax(2000);
      calculateTax(5000);

      function calculateTaxPer(cost, taxPercent) {
        console.log(cost * taxPercent);
      }

      calculateTaxPer(2000, 1.2);
      calculateTaxPer(5000, 0.1);

      function calculateTaxPer1(cost, taxPercent = 0.2) {
        console.log(cost * taxPercent);
      }

      calculateTaxPer1(2000, 1.2);
      calculateTaxPer1(5000);
    </script>
  </body>
</html>
