<!DOCTYPE html>
<html lang='en'>
  <head>
      <title>Event Listners - Advanced Functions</title>
  </head>
  <body>
    
    
    <button onclick="
      
    " class="js-button">Click</button>

    <script>

      const buttonElement = document.querySelector('.js-button');

      
      //  Event Listner
      //    Every HTML has method called EventListner - addEventListner()
      //    Lets us run some code when we interact with the element

      // Two Parameters
          // 1. Event - what type of interaction you want to listen for
                        // The way to find event is look for attribute onclick, the word after ON
          // 2. function

      buttonElement.addEventListener('click', () => {
        console.log('click');
      });

      // Advantages using EventListner over Attribute(onclick)
        // 1. Multiple event listners for an event
        // 2. remove an event listner - removeEventListner()

      // 1. both logs click are worked
      buttonElement.addEventListener('click', () => {
        console.log('click2');
      });

      // 2.
      
      const eventListner = () => {
        console.log('click3');
      }

      buttonElement.addEventListener('click', eventListner);

      // parameters, event, function to remove that no longer runs again
      // so a variable function is required
      buttonElement.removeEventListener('click', eventListner);

      buttonElement.addEventListener('click', () => {
        console.log('click4');
      });


      // filter - filter the array - works like foreach
      // array has negative numbers, clear all the negative numbers.
      // filter creates a new array, it it returns true, puts the value in array
        
      console.log([1,-3,5].filter( (value, index) => {
        return true;
      }));

      console.log([1,-3,5].filter( (value, index) => {
        return false;
      }));

      console.log([1,-3,5].filter( (value, index) => {
        if (value >=0 ){
          return true;
        } else {
          return false;
        }
      }));

      console.log([1,-3,5].filter( (value, index) => {
        return value >= 0;
      }));

      console.log([1,-3,5].filter( (value) => {
        return value >= 0;
      }));

      // short hand
      console.log([1,-3,5].filter( value => value >= 0 ));


      console.log([1,-3,5].filter( (value) => {
        console.log('Filter');
        return value + 10;
      }));

      
      // Map - works like for each and filter
      // Transforms an array into another array based on return value

      console.log([1,1,3].map((value, index) => {
        return 10;
      }));

      console.log([1,1,3].map((value, index) => {
        return value + 10;
      }));

      console.log([1,1,3].map((value, index) => {
        return value * 2;
      }));
      
      console.log([1,1,3].map((value) => {
        return value * 2;
      }));

      console.log([1,1,3].map( value => value * 2 ));



      // Filter is used to check conditions.
      // Map used to transform the values.

      // Closure
        // If a function has access to a value
        // it will always have access to that value
        // VALUE GETS PACKAGED TOGETHER (ENCLOSED) WITHIN THE FUNCTION

        // index is accessible inside the function only for arrays
      

    </script>
  </body>
</html>
