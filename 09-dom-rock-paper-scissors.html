<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors Functions</title>
  </head>
  <body>
    
    <p>Rock Paper Scissors</p>

    <button onclick="
      playGame('Rock');
    ">Rock</button>

    <button onclick="
      playGame('Paper');
    ">Paper</button>

    <button onclick="
      playGame('Scissors');
    ">Scissors</button>

    <!-- 
      <p> is a block element - takes up an entire line by itself
    -->

    <p class="js-result"></p>

    <p class="js-moves"></p>

    <p class="js-score"></p>

    <button onclick="
      // resetScores();

      score.Wins = 0;
      score.Ties = 0;
      score.Losses = 0;

      localStorage.removeItem('score');
      updateScoreElement();
    ">Reset Scores</button>

    <script>
      /*
      const score = {
        Wins: 0,
        Losses:0,
        Ties: 0
      }
      */

      // const score = JSON.parse(localStorage.getItem('score'));

      let score = JSON.parse(localStorage.getItem('score')) || {
        Wins: 0,
        Losses:0,
        Ties: 0
      }


      //document.querySelector('.js-score')
        //.innerHTML = `Wins: ${score.Wins}, Ties: ${score.Ties}, Losses: ${score.Losses}`; 
        
      updateScoreElement();

      //console.log(JSON.parse(localStorage.getItem('score')));

      function playGame(playerMove) {
      
        const computerMove = pickComputerMove();
        
        let result = '';

        if (playerMove === 'Rock') { 
          if (computerMove === 'Rock') {
            result = 'Tie!'
          } else if (computerMove === 'Paper') {
            result = 'You Lose!';
          } else if (computerMove === 'Scissors') {
            result = 'You Win!';
          }

        } else if (playerMove === 'Paper') {  
          if (computerMove === 'Rock') {
            result = 'You Win!';
          } else if (computerMove === 'Paper') {
            result = 'Tie!';
          } else if (computerMove === 'Scissors') {
            result = 'You Lose!';
          }
          
        } else if (playerMove === 'Scissors') {
          if (computerMove === 'Rock') {
            result = 'You Lose!';
          } else if (computerMove === 'Paper') {
            result = 'You Win!';
          } else if (computerMove === 'Scissors') {
            result = 'Tie!';
          }
        }

        if (result === 'You Win!') {
          score.Wins += 1;
        } else if (result === 'Tie!') {
          score.Ties += 1;
        } else if ( result === 'You Lose!' ) {
          score.Losses += 1;
        }
        
        localStorage.setItem('score', JSON.stringify(score));

        //document.querySelector('.js-score')
        //.innerHTML = `Wins: ${score.Wins}, Ties: ${score.Ties}, Losses: ${score.Losses}`; 
      
        updateScoreElement();

        document.querySelector('.js-result')
          .innerHTML = result;

        document.querySelector('.js-moves')
          .innerHTML = `You ${playerMove} - ${computerMove} Computer`;

        //console.log(score);
//         alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result} 
// Wins: ${score.Wins}, Ties: ${score.Ties}, Losses: ${score.Losses}`);
      }
      
      // function resetScores() {
      //   score.Wins = 0;
      //   score.Ties = 0;
      //   score.Losses = 0;

      //   localStorage.removeItem('score');

      //   console.log(score);
      //   //alert(`${score}`);
      // }

      function updateScoreElement() {
        document.querySelector('.js-score')
        .innerHTML = `Wins: ${score.Wins}, Ties: ${score.Ties}, Losses: ${score.Losses}`;
      }

      function pickComputerMove() {
        const randomNumber = Math.random();

        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'Rock';
          //alert('Rock is selected')
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'Paper';
        } else if (randomNumber >= 2/3 && randomNumber < 1) {
          computerMove = 'Scissors';        // var randomNumber = 0.5  -- doen't follow scope
        }

        return computerMove;
        //return; // undefined
        console.log('after'); // after return this will not execue
      }
    </script>
  </body>
</html>
