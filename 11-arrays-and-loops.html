<!DOCTYPE html>
<html lang='en'>
<head>
    <title>Arrays and Loops</title>
</head>
<body>

  <script>

    const array1 = [10,20,20,'Sri'];

    console.log(array1);
    console.log(array1[0]);

    console.log(array1[4]);

    array1[0] = 99;

    console.log(array1);

    array1[3] = 10;

    console.log(array1);

    const array2 = [
      100,
      200,
      300,
      400
    ];

    console.log(array2);

    console.log(typeof [1,2]);
    console.log(typeof array1);


    // Arrays are like objects they have properties and methods as well

    console.log(Array.isArray([1,2]));

    const array3 = [
      1,
      2,
      {name: 'Socks'},
      [10,20]
    ];

    console.log(array3);
    console.log(Array.isArray(array3));

    console.log(array3[2]);

    console.log(array3[2]['name']);

    array3.push(500);

    console.log(array3);

    array3.splice(0,2);       // remove index 0 - starting index, 2 - number of values to be removed

    console.log(array3);
    

    
    const todoList = [];        // Empty Array

    // LOOPS - which runs the same code again and again

    let i = 1;

    while (i<=10) {
      console.log(i);
      i += 1;
    }
    
    // for (i <= 10; i++) {             // Syntax Error
    //   console.log(i);            
    // }

    for (let i = 1; i <= 10; i++) {
      console.log(i);
    }

    // While Loop is considered as Non-Standard loop
        // No mandatory Increment Loop
    // For Loop is considered as Standard loop
        // Mandatory Increment Loop

    const loops1 = [
      'make dinner',
      'wash dishes',
      'watch youtube'
    ];

    // Looping through an Array
    for (index = 0; index <= loops1.length - 1; index++) {  // index <= loops1.length - 1 -> since index starts from 0
      // Or use index < loops1.length
      //console.log(loops1[index]);
      // i -> index

      const value = loops1[index];
      console.log(value);

    }


    // Accumulator Pattern

    const acmPattern = [
      1,1,3
    ];

    // Calculate the total for Accumulator Pattern
    // Create a variable to store the result
    // Loop through array and update the result
    let total = 0;

    for (let i = 0; i < acmPattern.length; i++) {
      const acm = acmPattern[i];
      total += acm;
    }
    console.log(total);

    let doublrAcm = [];
    let doublrAcm1 = [];

    for (let i = 0; i < acmPattern.length; i++) {
      const dAcm = acmPattern[i] * 2
      doublrAcm.push(dAcm);

      //  or

      const dAcm1 = acmPattern[i]
      doublrAcm1.push(dAcm1 * 5);

    }
    
    console.log(doublrAcm);
    console.log(doublrAcm1);


    // Arrays also follow references same as Objects

    const arr1 = [1,2,3];
    const arr2 = arr1;

    arr2.push(4);
    console.log(arr1);
    console.log(arr2);

    const arr3 = [1,2,3];
    const arr4 = arr3.slice();  // create a copy not reference

    arr4.push(4);
    console.log(arr3);
    console.log(arr4);

    const [firstValue, secondValue] = [1,2,34,4];

    console.log(firstValue,secondValue);


    // break - exit a loop early

    for (let i = 0; i <= 10; i++) {
      console.log(i);
      if (i === 8){
        break;
      }
    }

    // continue - allows to skip only 1 iteration

    // for (let i = 0; i <= 10; i++) {
    //   console.log(i);
    //   if (i === 8){
    //     continue;        this doesn't work because this is after console 
    //   }
    // }

    for (let i = 0; i <= 10; i++) {
      if (i === 8){
        continue;        
      }
      console.log(i);
    }


    //increment step
    // for loop - automatically
    // While loop - should add a condition
    console.log('new');

    let i1=0;
    while( i1 <= 10 ){

      if( i1 % 3 === 0){
        i1++;
        continue;
      }
      console.log(i1);
      i1++
    }


    

  </script>
    
</body>
</html>
