      //  document.querySelector() - lets us get any element from the page and put it inside JavaScript

      console.log(document.querySelector('body'));  // gets first body/button
      
      console.log(document.querySelector('button'));  // gets first body/button

      // every HTML elements has a property .innerHTML

      console.log(document.querySelector('button').innerHTML);

      document.querySelector('button')
        .innerHTML = 'JS Changed';

      // to get another button, we can get it by using class attribute which adds a lable for identification.
      // to access via class use .(dot) and name to ientify

      console.log( document.querySelector('.js-button'));
      
      const buttonElement = document.querySelector('.js-button');
      console.log(buttonElement);
