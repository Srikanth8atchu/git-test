<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors Functions</title>

    <!-- <style src="/css/10-rock-paper-scissors.css"></style> -->

    <link rel="stylesheet" href="/css/10-rock-paper-scissors.css">

  </head>
  <body>
    
    <p class="body-title">Rock Paper Scissors</p>

    <button onclick="
      playGame('Rock');
    " class="move-button">
      <img src="/images/rock-emoji.png" class="move-icon">
    </button>

    <button onclick="
      playGame('Paper');
    " class="move-button">
      <img src="/images/paper-emoji.png" class="move-icon">
    </button>

    <button onclick="
      playGame('Scissors');
    " class="move-button">
      <img src="/images/scissors-emoji.png" class="move-icon">
    </button>

    <!-- 
      <p> is a block element - takes up an entire line by itself
    -->

    <p class="js-result result"></p>

    <p class="js-moves moves-all"></p>

    <p class="js-score score"></p>

    <button onclick="
      // resetScores();

      score.Wins = 0;
      score.Ties = 0;
      score.Losses = 0;

      localStorage.removeItem('score');
      updateScoreElement();
    " class="reset-score-buttton">Reset Scores</button>

    <script src="/js/10-rock-papaer-scissors.js"></script>
  </body>
</html>
